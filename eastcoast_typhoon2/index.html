<!DOCTYPE html>
<html lang="zh-tw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <language>zh-tw</language>
    <title>東海岸即時影像 颱風動態監測</title>
    <link href="https://fonts.googleapis.com/css?family=Noto+Sans+TC&display=swap" rel="stylesheet">
    <style>
        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            counter-reset: section;
            padding: 0;
            margin: 0;
            background: #000;
        }

        /* ---- 整體：攝影機與 OBS 疊圖網格區 ---- */
        .wall {
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
        }

        /* OBS 疊圖預留區樣式 */
        .obs-box {
            position: relative;
            box-sizing: border-box;
            background: #0a0a0a;
            border: 1px inset red;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .obs-box span {
            color: #8a8a8a;
            text-align: center;
            border: 2px dashed #444;
            border-radius: 6px;
            padding: 10px 22px;
            letter-spacing: 1px;
            font: normal 16px/1.6 'Noto Sans TC', 'microsoft jhenghei', Roboto, sans-serif;
        }

        .obs-box small {
            color: #666;
            font-size: 12px;
        }

        /* ---- 攝影機格子共用樣式 ---- */
        .col {
            position: relative;
            background: #000;
            box-sizing: border-box;
            border: 1px inset red;
            overflow: hidden;
        }

        /* ---- 左上角圓形編號（暫時隱藏）---- */
        .col:before {
            display: none;
            width: 40px;
            height: 40px;
            border-radius: 20px;
            counter-increment: section;
            content: counter(section);
            position: absolute;
            background-color: yellow;
            text-align: center;
            left: 12px;
            top: 12px;
            font: bold 20px/40px 'Cascadia Code', Consolas, 'Courier New', monospace;
            z-index: 9;
        }

        /* ---- 地點名稱標籤 ---- */
        .col:after {
            display: block;
            max-width: 90%;
            height: 20px;
            content: attr(data-loc);
            position: absolute;
            color: white;
            left: 12px;
            top: 12px;
            letter-spacing: 1px;
            text-shadow: -1px 0 black, 0 1px black, 1px 0 black, 0 -1px black;
            font: normal 17px/40px 'Noto Sans TC', 'microsoft jhenghei', Roboto, sans-serif;
            z-index: 9;
        }

        iframe {
            width: 100%;
            height: 100%;
            display: block;
        }
    </style>
</head>
<body>
    <script src="data.js"></script>
    <script src="main.js"></script>
</body>
</html>
